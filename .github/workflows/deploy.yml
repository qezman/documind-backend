name: Build and Deploy Backend

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # - name: Debug OIDC token
      #   run: |
      #     curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
      #       "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | \
      #       cut -d '.' -f2 | base64 -d 2>/dev/null | jq .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::332130072211:role/documind-dev-github-actions-role
          aws-region: us-east-1

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/documind-backend:${{ github.sha }} .
          docker push $ECR_REGISTRY/documind-backend:${{ github.sha }}

      - name: Checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: qezman/documind-gitops
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: gitops

      - name: Patch rollout image
        run: |
          cd gitops
          sed -i "s|documind-backend:.*|documind-backend:${{ github.sha }}|" manifests/backend/rollout.yaml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add manifests/backend/rollout.yaml
          git commit -m "chore: deploy backend ${{ github.sha }}"
          git push
